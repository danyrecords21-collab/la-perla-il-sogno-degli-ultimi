    <script>
        const maxPaletti = 200;
        function calcolaPerimetro200() {
            let coordinate = [];
            for(let x=2; x<=44; x+=1.68) { coordinate.push({x: x, y: 2}); }
            for(let x=56; x<=98; x+=1.68) { coordinate.push({x: x, y: 2}); }
            for(let y=5; y<=95; y+=1.8) { coordinate.push({x: 98, y: y}); }
            for(let x=98; x>=2; x-=1.92) { coordinate.push({x: x, y: 96}); }
            for(let y=95; y>=5; y-=1.8) { coordinate.push({x: 2, y: y}); }
            return coordinate;
        }
        const mappaPerimetro = calcolaPerimetro200();
        
        let caniP = parseInt(localStorage.getItem('f3d_cani_p')) || 90;
        let caniC = localStorage.getItem('f3d_cani_c') === 'true';
        let cavalliP = parseInt(localStorage.getItem('f3d_cavalli_p')) || 0;
        let cavalliC = localStorage.getItem('f3d_cavalli_c') === 'true';
        
        const queryParams = new URLSearchParams(window.location.search);
        if (queryParams.get('status') === 'success') {
            const item = queryParams.get('item');
            if (item === 'paletti_cani') { caniP += 5; if(caniP > maxPaletti) caniP = maxPaletti; localStorage.setItem('f3d_cani_p', caniP); }
            else if (item === 'cancello_cani') { caniC = true; localStorage.setItem('f3d_cani_c', true); }
            else if (item === 'paletti_cavalli') { cavalliP += 5; if(cavalliP > maxPaletti) cavalliP = maxPaletti; localStorage.setItem('f3d_cavalli_p', cavalliP); }
            else if (item === 'cancello_cavalli') { cavalliC = true; localStorage.setItem('f3d_cavalli_c', true); }
            window.history.replaceState({}, document.title, window.location.pathname);
        }
        
        disegnaMondo3D();
        
        function eseguiPiantamento(tipo, quantita) {
            if(tipo === 'paletti_cani') { caniP += quantita; if(caniP > maxPaletti) caniP = maxPaletti; localStorage.setItem('f3d_cani_p', caniP); }
            else if(tipo === 'cancello_cani') { caniC = true; localStorage.setItem('f3d_cani_c', true); }
            else if(tipo === 'paletti_cavalli') { cavalliP += quantita; if(cavalliP > maxPaletti) cavalliP = maxPaletti; localStorage.setItem('f3d_cavalli_p', cavalliP); }
            else if(tipo === 'cancello_cavalli') { cavalliC = true; localStorage.setItem('f3d_cavalli_c', true); }
            disegnaMondo3D();
        }
        
        function disegnaMondo3D() {
            document.getElementById('campo-cani').innerHTML = "";
            document.getElementById('campo-cavalli').innerHTML = "";
            
            document.getElementById('lbl-cani-p').innerText = caniP;
            document.getElementById('lbl-cani-m').innerText = maxPaletti - caniP;
            let perCani = Math.round((caniP / maxPaletti) * 100);
            document.getElementById('barra-cani').style.width = perCani + '%';
            document.getElementById('barra-cani').innerText = perCani + '%';
            for (let i = 0; i < Math.min(caniP, mappaPerimetro.length); i++) {
                let el = document.createElement('div'); el.className = 'paletto-3d'; el.style.left = mappaPerimetro[i].x + '%'; el.style.top = mappaPerimetro[i].y + '%'; document.getElementById('campo-cani').appendChild(el);
            }
            if(caniC) {
                let el = document.createElement('div'); el.className = 'cancello-3d'; document.getElementById('campo-cani').appendChild(el);
                document.getElementById('lbl-cani-c').innerText = "MONTATO 🚪"; document.getElementById('lbl-cani-c').style.color = "#4caf50";
            }
            
            document.getElementById('lbl-cavalli-p').innerText = cavalliP;
            document.getElementById('lbl-cavalli-m').innerText = maxPaletti - cavalliP;
            let perCavalli = Math.round((cavalliP / maxPaletti) * 100);
            document.getElementById('barra-cavalli').style.width = perCavalli + '%';
            document.getElementById('barra-cavalli').innerText = perCavalli + '%';
            for (let i = 0; i < Math.min(cavalliP, mappaPerimetro.length); i++) {
                let el = document.createElement('div'); el.className = 'paletto-3d'; el.style.left = mappaPerimetro[i].x + '%'; el.style.top = mappaPerimetro[i].y + '%'; document.getElementById('campo-cavalli').appendChild(el);
            }
            if(cavalliC) {
                let el = document.createElement('div'); el.className = 'cancello-3d'; document.getElementById('campo-cavalli').appendChild(el);
                document.getElementById('lbl-cavalli-c').innerText = "MONTATO 🚪"; document.getElementById('lbl-cavalli-c').style.color = "#4caf50";
            }
        }
    </script>
